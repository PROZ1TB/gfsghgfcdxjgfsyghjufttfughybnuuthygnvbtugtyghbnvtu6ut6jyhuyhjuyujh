name: Build Bloom with True Opsec
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.2
      - name: Build True Opsec
        run: gradle build
      - name: Show True Opsec jar contents
        run: |
          ls build/libs
          unzip -l build/libs/trueopsec-1.0.0.jar | grep -Ei "mixin|refmap|TrueOpsec" || echo "NOTHING FOUND"
      - name: Merge into Bloom
        run: python3 merge_into_bloom.py bloom-client.jar build/libs/trueopsec-1.0.0.jar bloom-client-true-opsec.jar
      - name: Show merged jar contents
        run: unzip -l bloom-client-true-opsec.jar | grep -Ei "mixin|refmap|TrueOpsec" || echo "NOTHING FOUND"
      - uses: actions/upload-artifact@v4
        with:
          name: bloom-client-true-opsec
          path: bloom-client-true-opsec.jar
